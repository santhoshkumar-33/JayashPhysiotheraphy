<!-- ==========================================
     GALLERY PREVIEW
========================================== -->

<section class="gallery-preview py-5" id="gallery">

    <div class="container">

        <!-- ======================================
             SECTION HEADING
        ======================================= -->

        <div class="section-heading text-center mb-5">

            <!-- Eyebrow -->

            <div class="gallery-eyebrow">

                <span class="gallery-line"></span>

                <span>
                    Our Clinic
                </span>

                <span class="gallery-line"></span>

            </div>


            <!-- Heading -->

            <h2 class="section-title mt-3">

                Experience Our Modern Physiotherapy Centre

            </h2>


            <!-- Divider -->

            <div class="section-divider"></div>


            <!-- Description -->

            <p class="section-description gallery-description mx-auto mt-4">

                Explore our welcoming clinic, modern rehabilitation equipment,
                and comfortable treatment spaces designed to support your
                recovery journey.

            </p>

        </div>


        <!-- ======================================
             SWIPER GALLERY
        ======================================= -->

        <div class="swiper gallerySwiper">

            <div class="swiper-wrapper">

                {% for i in range(1,7) %}

                <div class="swiper-slide">

                    <a
                        href="{{ url_for(
                            'static',
                            filename='images/gallery/clinic-' ~ i ~ '.jpg'
                        ) }}"
                        class="gallery-item"
                    >

                        <img
                            src="{{ url_for(
                                'static',
                                filename='images/gallery/clinic-' ~ i ~ '.jpg'
                            ) }}"
                            alt="Jayash Physiotherapy Clinic Image {{ i }}"
                        >

                        <div class="gallery-overlay">

                            <i class="fa-solid fa-expand"></i>

                        </div>

                    </a>

                </div>

                {% endfor %}

            </div>


            <!-- ==================================
                 NAVIGATION
            =================================== -->

            <div class="swiper-button-prev"></div>

            <div class="swiper-button-next"></div>


            <!-- ==================================
                 PAGINATION
            =================================== -->

            <div class="swiper-pagination"></div>

        </div>


        <!-- ======================================
             VIEW FULL GALLERY BUTTON
        ======================================= -->

        <div class="text-center mt-5">

            <a
                href="/gallery"
                class="btn btn-primary rounded-pill px-5 py-3"
            >

                View Full Gallery

            </a>

        </div>

    </div>

</section>
