<!-- ==========================================================
     HERO SECTION
========================================================== -->

<section class="jayash-hero">

    <div class="jayash-hero-container">

        <div class="container">

            <div class="row align-items-center jayash-hero-row">

                <!-- ==================================================
                     HERO CONTENT
                ================================================== -->

                <div class="col-lg-6">

                    <div class="jayash-hero-content">

                        <!-- Eyebrow -->

                        <div class="jayash-hero-eyebrow">

                            <span class="jayash-eyebrow-line"></span>

                            <span class="hero-badge">
                                <i class="fa-solid fa-heart-pulse"></i>
                                Trusted Physiotherapy Clinic
                                <i class="fa-solid fa-heart-pulse"></i>
                            </span>

                            <span class="jayash-eyebrow-line"></span>

                        </div>


                        <!-- Main Heading -->

                        <h1 class="jayash-hero-title">

                            Restore Movement
                            <br>
                            Relieve Pain
                            <br>
                            Live Better

                        </h1>


                        <!-- Description -->

                        <p class="jayash-hero-description">

                            Personalised physiotherapy care designed
                            around your recovery, mobility and confidence.

                        </p>


                        <!-- CTA -->

                        <div class="jayash-hero-actions">

                            <a
                                href="{{ url_for('appointment.book_appointment') }}"
                                class="jayash-hero-primary">

                                <span>
                                    Book Appointment
                                </span>

                                <i class="fa-solid fa-arrow-right"></i>

                            </a>


                            <a
                                href="#services"
                                class="jayash-hero-secondary">

                                <span>
                                    Explore Services
                                </span>

                                <i class="fa-solid fa-arrow-right"></i>

                            </a>

                        </div>


                        <!-- Trust Features -->

                        <div class="jayash-hero-trust">

                            <div class="jayash-trust-item">

                                <span class="jayash-trust-icon">

                                    <i class="fa-solid fa-file-medical"></i>

                                </span>

                                <span class="jayash-trust-text">
                                    Personalised Care
                                </span>

                            </div>


                            <div class="jayash-trust-item">

                                <span class="jayash-trust-icon">

                                    <i class="fa-solid fa-user-doctor"></i>

                                </span>

                                <span class="jayash-trust-text">
                                    Experienced Therapists
                                </span>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ==================================================
                     HERO IMAGE
                ================================================== -->

                <div class="col-lg-6">

                    <div class="jayash-hero-visual">

                        <!-- Background Shape -->

                        <div class="jayash-hero-visual-bg"></div>


                        <!-- Image -->

                        <div class="jayash-hero-image-wrapper">

                            <img
                                src="{{ url_for(
                                    'static',
                                    filename='images/hero-physio.png'
                                ) }}"
                                class="jayash-hero-image"
                                alt="Professional physiotherapist">

                        </div>


                        <!-- Experience Badge -->

                        <div class="jayash-experience-badge">

                            <span class="jayash-experience-number">
                                5+
                            </span>

                            <span class="jayash-experience-text">
                                Years of<br>
                                Experience
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
