<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         BASIC META
    ========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta http-equiv="X-UA-Compatible"
          content="IE=edge">

    <title>

        {% block title %}

        Jayash Physio | Physiotherapy Clinic

        {% endblock %}

    </title>

    <!-- ==========================================
         SEO
    ========================================== -->

    <meta name="description"
          content="{% block meta_description %}
          Professional physiotherapy clinic offering personalized rehabilitation,
          pain management and home visit physiotherapy.
          {% endblock %}">

    <meta name="keywords"
          content="Physiotherapy, Rehabilitation, Back Pain,
          Neck Pain, Sports Injury, Chennai Physiotherapy">

    <meta name="author"
          content="Jayash Physio">

    <meta name="robots"
          content="index,follow">

    <!-- ==========================================
         OPEN GRAPH
    ========================================== -->

    <meta property="og:title"
          content="{% block og_title %}Jayash Physio{% endblock %}">

    <meta property="og:description"
          content="{% block og_description %}
          Premium Physiotherapy Clinic
          {% endblock %}">

    <meta property="og:type"
          content="website">

    <meta property="og:image"
          content="{{ url_for('static', filename='images/logo.png') }}">

    <!-- ==========================================
         FAVICON
    ========================================== -->

    <link rel="icon"
          href="{{ url_for('static', filename='images/favicon.ico') }}">

    <!-- ==========================================
         GOOGLE FONTS
    ========================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- ==========================================
         BOOTSTRAP
    ========================================== -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- ==========================================
         FONT AWESOME
    ========================================== -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- ==========================================
         AOS
    ========================================== -->

    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css"
          rel="stylesheet">

    <!-- ==========================================
         GLIGHTBOX
    ========================================== -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">

    <!-- ==========================================
         SWIPER
    ========================================== -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- ==========================================
         CUSTOM CSS
    ========================================== -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/appointment.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/responsive.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/navbar.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/hero.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/about.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/services.css') }}">  
          
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/doctor.css') }}"> 

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/treatment.css') }}">  
          
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/testimonials.css') }}"> 

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/gallery.css') }}">  
          
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/whyus.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/faq.css') }}">  
          
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/contactus.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/footer.css') }}">

    {% block extra_css %}

    {% endblock %}

</head>
<body>

    <!-- ==========================================
         LOADER
    ========================================== -->

    {% include "partials/loader.html" %}

    <!-- ==========================================
         NAVBAR
    ========================================== -->

    {% include "partials/navbar.html" %}

    <!-- ==========================================
         MAIN CONTENT
    ========================================== -->

    <main>

        {% block content %}

        {% endblock %}

    </main>

    <!-- ==========================================
         FOOTER
    ========================================== -->

    {% include "partials/footer.html" %}

    <!-- ==========================================
         FLOATING BUTTONS
    ========================================== -->

    {% include "partials/floating_buttons.html" %}

    <!-- ==========================================
         JAVASCRIPT LIBRARIES
    ========================================== -->

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AOS -->

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <!-- Swiper -->

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- GLightbox -->

    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

    <!-- ==========================================
         CUSTOM JAVASCRIPT
    ========================================== -->

    <!-- Main -->

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <!-- Gallery -->

    <script src="{{ url_for('static', filename='js/gallery.js') }}"></script>

    <!-- Appointment -->

    <script src="{{ url_for('static', filename='js/appointment.js') }}"></script>

    {% block extra_js %}

    {% endblock %}

    <!-- ==========================================
         INITIALIZE LIBRARIES
    ========================================== -->

    <script>

        AOS.init({

            duration: 800,

            once: true

        });

        // Initialize GLightbox only if gallery items exist

        if (document.querySelector(".gallery-item")) {

            GLightbox({

                selector: ".gallery-item"

            });

        }

    </script>

</body>

</html>
